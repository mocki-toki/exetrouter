name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  nix-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31
      - run: nix flake check --all-systems --no-build --no-update-lock-file
      - run: nix build .#checks.x86_64-linux.modules --no-link
      - run: nix build .#checks.x86_64-linux.opencode-plugin --no-link
  compat-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust stable with formatting
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: cargo fmt --check
      - run: python3 scripts/test-compat-agent.py
      - run: python3 scripts/test-native-tools.py
      - run: node --test clients/opencode-v1/context.test.js
      - name: Publication, package and Docker updater checks
        run: |
          python3 scripts/check-publication.py
          python3 scripts/test-docker-update.py
          cargo package --locked --list > package-files.txt
          python3 scripts/check-publication.py --package-list package-files.txt
      - run: python3 scripts/test-compat-sandbox.py
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Rust stable with checks
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: MCP SDK integration (synthetic loopback only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm install --prefix target/mcp-sdk --ignore-scripts --no-audit --no-fund --package-lock=false @modelcontextprotocol/sdk@1.32.2
          EXR_MCP_SDK_ROOT="$PWD/target/mcp-sdk/node_modules/@modelcontextprotocol/sdk" cargo test --locked --test native_tools mcp_official_sdk
      - name: Installer checks
        run: python3 scripts/test-installer.py
