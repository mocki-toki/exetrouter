# Include in the existing edge-nginx http context behind edge-sni-router.
# HAProxy owns public 443 and sends PROXY v2 to loopback 8443.
# Replace certificate paths before use.
map $http_upgrade $exetrouter_connection {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name api.example.com;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    listen [::1]:8443 ssl proxy_protocol;
    server_name api.example.com;
    access_log off;
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    client_max_body_size 16m;
    # Request/response payloads and headers must never be logged.
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $exetrouter_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }
    location / { return 404; }
}
