[package]
name = "exetrouter"
version = "0.8.3"
edition = "2021"
license = "MIT"
rust-version = "1.88"
description = "A privacy-conscious Codex/OpenCode model router with SSH management"
repository = "https://github.com/mocki-toki/exetrouter"
readme = "README.md"
# Root-only documents must not pull in nested dependency README/LICENSE files.
include = ["src/**", "tests/**", "docs/**", "deploy/**", "scripts/*.py", "scripts/*.sh", "scripts/compat_agent/*.py", "scripts/compat_agent/Dockerfile", "skills/**", "prompts/**", "clients/opencode-v1/**", "/Cargo.lock", "/README.md", "/LICENSE", "/SECURITY.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/AGENTS.md", "/CLAUDE.md"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
futures-util = "0.3"
hmac = "0.12"
iana-time-zone = "0.1"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
# The released Codex transport pins these forks for RFC 7692 support, which the
# crates.io Tungstenite transport used by Axum does not implement.
codex-websocket = { package = "tokio-tungstenite", version = "0.28", git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186", features = ["rustls-tls-webpki-roots"] }
codex-tungstenite = { package = "tungstenite", version = "0.27", git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f", features = ["deflate"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
zstd = { version = "0.13", default-features = false }

crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
